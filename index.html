<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Apple Favorite — Цифровые сервисы</title>
  <meta name="description" content="Apple Favorite: подарочные карты, подписки и установка приложений." />
  <link rel="icon" type="image/png" href="img/logo.png" />
  <link rel="apple-touch-icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main id="screen" class="screen"></main>

  <!-- Плавающая панель покупки -->
  <div id="buybar" class="buybar" hidden>
    <button class="buybar-info" id="buybar-info" aria-label="Состав заказа">
      <span class="buybar-label" id="buybar-label"></span>
      <span class="buybar-price"><span id="buybar-price"></span><s id="buybar-old"></s></span>
    </button>
    <button class="buybar-clear" id="buybar-clear" aria-label="Сбросить выбор"></button>
    <button class="buybar-buy" id="buybar-buy">Купить <span aria-hidden="true">→</span></button>
  </div>

  <!-- Нижнее меню (иконки подставляет js/app.js) -->
  <nav class="tabbar" id="tabbar">
    <button data-tab="catalog" class="is-active"><span class="ti"></span><span>Каталог</span></button>
    <button data-tab="orders"><span class="ti"></span><span>Заказы</span></button>
    <button data-tab="referrals"><span class="ti"></span><span>Рефералы</span></button>
    <button data-tab="profile"><span class="ti"></span><span>Профиль</span></button>
  </nav>

  <!-- Нижняя шторка (оформление, набор приложений, инструкции) -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui-icons.js"></script>
  <script src="js/app-icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
